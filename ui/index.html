<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flip</title>
<link rel="stylesheet" href="pet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="title">
      <button id="menu-btn" class="icon-btn" title="Chats, memory and settings">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span id="pet-name">Flip</span>
      <span id="roblox-dot" class="dot" title="Roblox Studio: starting"></span>
    </div>
    <div class="actions">
      <button id="desk-btn" class="icon-btn" title="Show pet on desktop">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/><circle cx="15.5" cy="10" r="2.2" class="fill"/></svg>
      </button>
      <button id="mute-btn" class="icon-btn" title="Voice on/off">
        <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="on-only" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="off-only" d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
      <button id="reset-btn" class="icon-btn" title="New chat">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>
    </div>
  </header>

  <section id="stage" class="pet-stage">
    <div id="pet-host"></div>
    <div class="pet-shadow"></div>
    <div id="status">vibing</div>
  </section>

  <section id="chat"></section>

  <section id="voice-ui">
    <div id="cap-you" class="caption"></div>
    <div id="cap-pet" class="caption pet-cap"></div>
    <div class="voice-hint">just talk · tap him to cut him off</div>
    <button id="end-voice" class="end-btn" title="End voice chat">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </section>

  <footer>
    <button id="mic-btn" class="round" title="Say a message (click to start, click again to send)">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
    </button>
    <textarea id="input" rows="1" placeholder="talk to Flip…"></textarea>
    <button id="voice-btn" class="round" title="Voice chat">
      <svg viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>
    </button>
    <button id="send-btn" class="round" title="Send">
      <svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg>
    </button>
  </footer>

  <div id="scrim"></div>
  <aside id="drawer">
    <button id="new-chat" class="new-chat">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> New chat
    </button>
    <div class="drawer-label">Chats</div>
    <div id="chat-list"></div>
    <div class="drawer-foot">
      <button id="switch-btn" class="drawer-item">👤 <span id="who-name">Profile</span> · switch</button>
      <button id="memory-btn" class="drawer-item">🧠 What I remember</button>
      <button id="settings-btn" class="drawer-item">⚙️ Settings</button>
    </div>
  </aside>

  <section id="panel">
    <div class="panel-head">
      <h2 id="panel-title"></h2>
      <button id="panel-close" class="icon-btn" title="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="memory-panel" class="panel-body">
      <p class="hint">Stuff I remember about you across all chats. I add to this myself when you tell me things.</p>
      <div class="add-row">
        <input id="mem-input" placeholder="teach me something about you…" maxlength="200">
        <button id="mem-add">add</button>
      </div>
      <div id="mem-list"></div>
    </div>
    <div id="settings-panel" class="panel-body">
      <label>My name<input id="set-name" maxlength="24"></label>
      <label>My voice
        <select id="set-voice">
          <option value="en-US-BrianNeural">Brian (chill, default)</option>
          <option value="en-US-AndrewNeural">Andrew (warm)</option>
          <option value="en-US-GuyNeural">Guy (hype)</option>
          <option value="en-US-ChristopherNeural">Christopher (deep)</option>
          <option value="en-US-EricNeural">Eric (calm)</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="set-roblox"> Connect to Roblox Studio</label>
      <div class="set-actions">
        <button id="set-save" class="primary">save</button>
        <button id="set-folder">open my folder</button>
      </div>
      <p id="set-note" class="hint"></p>
    </div>
  </section>

  <section id="profiles">
    <h1>who's chatting? 👀</h1>
    <p class="hint center">everyone gets their own chats and memory</p>
    <div id="prof-grid"></div>
    <button id="prof-manage" class="link-btn">manage profiles</button>

    <div id="prof-form" class="prof-box" hidden>
      <h2 id="prof-form-title">make your profile</h2>
      <input id="prof-name" placeholder="your name" maxlength="24" autocomplete="off">
      <input id="prof-pin" placeholder="PIN (optional, 4-8 numbers)" maxlength="8" inputmode="numeric" type="password" autocomplete="off">
      <p id="prof-error" class="err"></p>
      <div class="set-actions">
        <button id="prof-create" class="primary">let's go</button>
        <button id="prof-cancel">back</button>
      </div>
    </div>

    <div id="pin-box" class="prof-box" hidden>
      <h2 id="pin-title">enter your PIN</h2>
      <input id="pin-input" placeholder="PIN" maxlength="8" inputmode="numeric" type="password" autocomplete="off">
      <p id="pin-error" class="err"></p>
      <div class="set-actions">
        <button id="pin-go" class="primary">enter</button>
        <button id="pin-back">back</button>
      </div>
    </div>
  </section>

  <section id="setup">
    <div class="setup-card">
      <h2 id="setup-title">waking up…</h2>
      <p id="setup-detail"></p>
      <div class="bar"><div id="setup-bar"></div></div>
      <p id="setup-note">first time only, after this I start instantly</p>
      <button id="setup-retry" hidden>try again</button>
    </div>
  </section>
</div>
<script src="pet.js"></script>
<script src="app.js"></script>
</body>
</html>
