<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flip pet</title>
<link rel="stylesheet" href="pet.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { font: 13px/1.35 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  #stage { position: absolute; left: 0; right: 0; bottom: 6px; display: flex; flex-direction: column; align-items: center; }
  #pet-host .pet { width: 150px; height: 150px; }
  #stage .pet-shadow { width: 84px; height: 11px; margin-top: -10px; background: rgba(0, 0, 0, .28); }
  #bubble {
    position: absolute; left: 10px; right: 10px; top: 4px; padding: 7px 11px; border-radius: 14px;
    background: #fff; color: #1c1631; box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    opacity: 0; transform: translateY(6px) scale(.96); transition: opacity .2s, transform .2s; pointer-events: none;
  }
  #bubble.show { opacity: 1; transform: none; }
  #tools {
    position: absolute; right: 16px; top: 64px; display: flex; flex-direction: column; gap: 6px;
    opacity: 0; transform: translateX(6px); transition: opacity .18s, transform .18s; pointer-events: none;
  }
  body.hover #tools { opacity: 1; transform: none; pointer-events: auto; }
  #tools button {
    width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer;
    background: #1f1c2e; color: #f4f1ff; display: grid; place-items: center;
    box-shadow: 0 3px 10px rgba(0, 0, 0, .3);
  }
  #tools button:hover { background: #5ff0b8; color: #0f2a20; }
  #tools svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
  <div id="bubble"></div>
  <div id="stage" class="pet-stage">
    <div id="pet-host"></div>
    <div class="pet-shadow"></div>
  </div>
  <div id="tools">
    <button id="chat-btn" title="Open chat">
      <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
    </button>
    <button id="hide-btn" title="Hide pet">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
<script src="pet.js"></script>
<script src="desk.js"></script>
</body>
</html>
